steps:

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/siliconstock-back:$COMMIT_SHA', '.']


  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/siliconstock-back:$COMMIT_SHA']


  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'siliconstock-back' 
      - '--image'
      - 'gcr.io/$PROJECT_ID/siliconstock-back:$COMMIT_SHA'
      - '--region'
      - 'europe-west9' 
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/siliconstock-back:$COMMIT_SHA'


options:
  logging: CLOUD_LOGGING_ONLY